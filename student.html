<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SBA Student Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:#e8edf5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

}

.login-card{

    width:390px;
    background:#e8edf5;
    padding:45px 35px;
    border-radius:30px;

    box-shadow:
    12px 12px 24px rgba(0,0,0,.15),
    -12px -12px 24px rgba(255,255,255,.9);

}

.logo{

    width:100px;
    height:100px;

    margin:auto;

    border-radius:50%;

    background:#e8edf5;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;

    color:#3F51B5;

    box-shadow:
    8px 8px 16px rgba(0,0,0,.15),
    -8px -8px 16px white;

}

h2{

    margin-top:25px;
    text-align:center;
    color:#3F51B5;

}

.subtitle{

    text-align:center;
    color:#777;
    margin-top:8px;
    margin-bottom:35px;

}

.input-box{

    display:flex;
    align-items:center;

    margin-bottom:22px;

    padding:16px 20px;

    border-radius:50px;

    background:#e8edf5;

    box-shadow:
    inset 5px 5px 10px rgba(0,0,0,.12),
    inset -5px -5px 10px white;

}

.input-box input{

    width:100%;
    border:none;
    outline:none;
    background:none;

    padding-left:15px;

    font-size:15px;

}

.input-box i{

    color:#777;

}

.toggle{

    cursor:pointer;
}

.options{

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:14px;

    margin-bottom:25px;

}

.options a{

    color:#3F51B5;
    text-decoration:none;

}

button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:50px;

    background:#3F51B5;

    color:white;

    font-size:16px;
    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#3144b0;
    transform:translateY(-2px);

}

.footer{

    text-align:center;
    margin-top:25px;
    color:#888;
    font-size:13px;

}

@media(max-width:480px){

.login-card{

    width:92%;

}

}

</style>

</head>
<body>

<div class="login-card">

    <div class="logo">
        <i class="fas fa-user-graduate"></i>
    </div>

    <h2>SBA Student Portal</h2>

    <p class="subtitle">Student Login</p>

    <form id="loginForm">

        <div class="input-box">

            <i class="fas fa-id-card"></i>

            <input
                type="text"
                id="studentid"
                placeholder="Student ID"
                required>

        </div>

        <div class="input-box">

            <i class="fas fa-lock"></i>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <i class="fas fa-eye toggle" id="togglePassword"></i>

        </div>

        <div class="options">

            <label>

                <input type="checkbox">

                Remember Me

            </label>

            <a href="#">Forgot Password?</a>

        </div>

        <button type="submit">

            LOGIN

        </button>

    </form>

    <div class="footer">

        © 2026 SBA Student Portal

    </div>

</div>

<script>

const password=document.getElementById("password");
const toggle=document.getElementById("togglePassword");

toggle.onclick=function(){

    if(password.type==="password"){

        password.type="text";

        toggle.classList.replace("fa-eye","fa-eye-slash");

    }else{

        password.type="password";

        toggle.classList.replace("fa-eye-slash","fa-eye");

    }

};

document.getElementById("loginForm").addEventListener("submit",function(e){

    e.preventDefault();

    let studentid=document.getElementById("studentid").value;
    let password=document.getElementById("password").value;

    alert("Student ID: "+studentid+"\nPassword: "+password);

});

</script>

</body>
</html>
