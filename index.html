<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase Student Portal</title>

<style>
body{
    font-family:Arial;
    background:#eef2f7;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
}

button{
    background:#007bff;
    color:#fff;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f1f1f1;
    border-radius:8px;
}

img{
    max-width:120px;
    margin-top:10px;
    border-radius:8px;
}
</style>

</head>
<body>

<div class="container">

<h2>Student Portal (Supabase Version)</h2>

<h3>Add / Update Student</h3>

<input type="hidden" id="studentId">

<input type="text" id="name" placeholder="Student Name">

<input type="text" id="class" placeholder="Class">

<input type="number" id="math" placeholder="Math">

<input type="number" id="english" placeholder="English">

<input type="number" id="science" placeholder="Science">

<input type="file" id="photo">

<button onclick="saveStudent()">Save Student</button>

<hr>

<h3>Search Student</h3>

<input type="text" id="searchName" placeholder="Enter Student Name">

<button onclick="searchStudent()">Search</button>

<div class="result" id="result"></div>

</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

// ===============================
// SUPABASE CONFIG
// ===============================

const supabaseUrl =
"https://ftslcifbzohhgljqcgus.supabase.co";

const supabaseKey =
"sb_publishable_xF3b2JXH72rrwvJ2MCfOuA_Lm_C-a2D";

const supabase =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

// ===============================
// FUNCTIONS
// ===============================

function calculateTotal(s){
    return Number(s.math) + Number(s.english) + Number(s.science);
}

function calculateGrade(total){

    if(total >= 240) return "A";
    if(total >= 180) return "B";
    if(total >= 120) return "C";

    return "D";
}

// ===============================
// SAVE STUDENT
// ===============================

async function saveStudent(){

    const id = document.getElementById("studentId").value;

    const name = document.getElementById("name").value;

    const studentClass = document.getElementById("class").value;

    const math = document.getElementById("math").value;

    const english = document.getElementById("english").value;

    const science = document.getElementById("science").value;

    const file = document.getElementById("photo").files[0];

    let photoUrl = "";

    // ===============================
    // UPLOAD PHOTO
    // ===============================

    if(file){

        const fileName = Date.now() + "_" + file.name;

        const { data: uploadData, error: uploadError } =
        await supabase.storage
        .from("student-photos")
        .upload(fileName, file);

        if(uploadError){
            alert(uploadError.message);
            return;
        }

        const { data } = supabase.storage
        .from("student-photos")
        .getPublicUrl(fileName);

        photoUrl = data.publicUrl;
    }

    const studentData = {
        name:name,
        class:studentClass,
        math:math,
        english:english,
        science:science
    };

    if(photoUrl){
        studentData.photo = photoUrl;
    }

    // ===============================
    // INSERT OR UPDATE
    // ===============================

    if(id){

        const { error } = await supabase
        .from("students")
        .update(studentData)
        .eq("id", id);

        if(error){
            alert(error.message);
            return;
        }

        alert("Student Updated");

    }else{

        const { error } = await supabase
        .from("students")
        .insert([studentData]);

        if(error){
            alert(error.message);
            return;
        }

        alert("Student Saved");
    }

    location.reload();
}

// ===============================
// SEARCH STUDENT
// ===============================

async function searchStudent(){

    const searchName = document
    .getElementById("searchName")
    .value
    .toLowerCase();

    const resultDiv = document.getElementById("result");

    const { data: students, error } = await supabase
    .from("students")
    .select("*");

    if(error){
        resultDiv.innerHTML = error.message;
        return;
    }

    const s = students.find(
        st => st.name.toLowerCase() === searchName
    );

    if(s){

        const total = calculateTotal(s);

        const grade = calculateGrade(total);

        resultDiv.innerHTML = `
            <b>Name:</b> ${s.name}<br>
            <b>Class:</b> ${s.class}<br>
            <b>Math:</b> ${s.math}<br>
            <b>English:</b> ${s.english}<br>
            <b>Science:</b> ${s.science}<br>
            <b>Total:</b> ${total}<br>
            <b>Grade:</b> ${grade}<br>

            ${
                s.photo
                ? `<img src="${s.photo}">`
                : ""
            }

            <br><br>

            <button onclick="editStudent('${s.id}')">
                Edit
            </button>

            <button onclick="deleteStudent('${s.id}')">
                Delete
            </button>

            <button onclick="printReport('${s.id}')">
                Print
            </button>
        `;

    }else{

        resultDiv.innerHTML = "Student not found";
    }
}

// ===============================
// EDIT STUDENT
// ===============================

async function editStudent(id){

    const { data:s, error } = await supabase
    .from("students")
    .select("*")
    .eq("id", id)
    .single();

    if(error){
        alert(error.message);
        return;
    }

    document.getElementById("studentId").value = s.id;

    document.getElementById("name").value = s.name;

    document.getElementById("class").value = s.class;

    document.getElementById("math").value = s.math;

    document.getElementById("english").value = s.english;

    document.getElementById("science").value = s.science;
}

// ===============================
// DELETE STUDENT
// ===============================

async function deleteStudent(id){

    if(confirm("Delete this student?")){

        const { error } = await supabase
        .from("students")
        .delete()
        .eq("id", id);

        if(error){
            alert(error.message);
            return;
        }

        alert("Deleted");

        location.reload();
    }
}

// ===============================
// PRINT REPORT
// ===============================

async function printReport(id){

    const { data:s, error } = await supabase
    .from("students")
    .select("*")
    .eq("id", id)
    .single();

    if(error){
        alert(error.message);
        return;
    }

    const total = calculateTotal(s);

    const grade = calculateGrade(total);

    let win = window.open('', '', 'width=600,height=600');

    win.document.write(`
        <h2>Student Report</h2>

        <p>Name: ${s.name}</p>

        <p>Class: ${s.class}</p>

        <p>Math: ${s.math}</p>

        <p>English: ${s.english}</p>

        <p>Science: ${s.science}</p>

        <p>Total: ${total}</p>

        <p>Grade: ${grade}</p>

        ${
            s.photo
            ? `<img src="${s.photo}" width="120">`
            : ""
        }
    `);

    win.print();
}

</script>

</body>
</html>
