<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Assessment System</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    padding: 20px;
}

h1 {
    text-align: center;
    color: white;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

input, button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
}

button {
    background: #007bff;
    color: white;
    border: none;
}

button:hover {
    background: #0056b3;
}

.logout {
    background: red;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #f1f1f1;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

table, th, td {
    border: 1px solid #ccc;
}

th, td {
    padding: 8px;
    text-align: center;
}

.grade {
    font-weight: bold;
    color: green;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>

<body>

<h1>📊 Student Assessment System</h1>

<!-- LOGIN -->
<div id="loginBox" class="container">
    <h3>🔐 Admin Login</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="loginMsg" style="color:red;"></p>
</div>

<!-- MAIN SYSTEM -->
<div id="mainSystem" style="display:none;" class="container">

<button class="logout" onclick="logout()">🚪 Logout</button>

<h3>Add Student</h3>

<input type="text" id="name" placeholder="Student Name">
<input type="text" id="class" placeholder="Class">

<input type="number" id="math" placeholder="Math">
<input type="number" id="english" placeholder="English">
<input type="number" id="science" placeholder="Science">
<input type="number" id="ict" placeholder="ICT">
<input type="number" id="rme" placeholder="RME">
<input type="number" id="creative" placeholder="Creative Arts">
<input type="number" id="history" placeholder="History">
<input type="number" id="fante" placeholder="Fante">

<button onclick="saveStudent()">Save Student</button>

<hr>

<h3>Search Student</h3>
<input type="text" id="searchName" placeholder="Enter Name">
<button onclick="searchStudent()">Search</button>

<div class="result" id="result"></div>

<hr>

<button onclick="displayStudents()">📋 View All Students</button>

<div id="tableContainer"></div>

</div>

<script>


// LOGIN SYSTEM
let defaultUser = { username: "admin", password: "1234" };

if (!localStorage.getItem("user")) {
    localStorage.setItem("user", JSON.stringify(defaultUser));
}

function login() {
    let u = document.getElementById("username").value;
    let p = document.getElementById("password").value;

    let storedUser = JSON.parse(localStorage.getItem("user"));

    if (u === storedUser.username && p === storedUser.password) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("mainSystem").style.display = "block";
        localStorage.setItem("loggedIn", "true");
    } else {
        document.getElementById("loginMsg").innerText = "Invalid login!";
    }
}

if (localStorage.getItem("loggedIn") === "true") {
    window.onload = () => {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("mainSystem").style.display = "block";
    };
}

function logout() {
    localStorage.removeItem("loggedIn");
    location.reload();
}

const supabaseUrl =
"https://ftslcifbzohhgljqcgus.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0c2xjaWZiem9oaGdsanFjZ3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTQ5NjUsImV4cCI6MjA5NTAzMDk2NX0.O6bGKNOdRDH1u2t-MiK8y0ppO-q-P4gggSeDEGsoUrQ";

const supabase =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

let students = [];

function calculateGrade(avg) {
    if (avg >= 80) return "A";
    if (avg >= 70) return "B";
    if (avg >= 60) return "C";
    if (avg >= 50) return "D";
    return "F";
}

async function saveStudent() {

    let name = document.getElementById("name").value;
    let studentClass = document.getElementById("class").value;

    let subjects = ["math","english","science","ict","rme","creative","history","fante"];

    let scores = subjects.map(s =>
        parseFloat(document.getElementById(s).value)
    );

    if (!name || !studentClass || scores.some(isNaN)) {
        alert("Fill all fields!");
        return;
    }

    let total = scores.reduce((a,b)=>a+b,0);
    let average = total / subjects.length;
    let grade = calculateGrade(average);

    let student = {

        name: name,
        class: studentClass,

        math: scores[0],
        english: scores[1],
        science: scores[2],
        ict: scores[3],
        rme: scores[4],
        creative: scores[5],
        history: scores[6],
        fante: scores[7],

        total: total,
        average: average,
        grade: grade,
        position: 0
    };

    const { error } = await supabase
        .from("students")
        .insert([student]);

    if (error) {
        console.log(error);
        alert("Error saving student!");
        return;
    }

    alert("Student Saved Online!");

    loadStudents();

    document.querySelectorAll("input").forEach(i => i.value="");
}

async function loadStudents() {

    const { data, error } = await supabase
        .from("students")
        .select("*");

    if (error) {
        console.log(error);
        return;
    }

    students = data;

    rankStudents();
}

function rankStudents() {
    students.sort((a,b)=>b.total - a.total);
    students.forEach((s,i)=> s.position = i + 1);
}

function searchStudent() {

    let name = document.getElementById("searchName").value.toLowerCase();

    let student = students.find(s => s.name.toLowerCase() === name);

    let resultDiv = document.getElementById("result");

    if (student) {
        resultDiv.innerHTML = `
        <h3>${student.name}</h3>
        Class: ${student.class}<br><br>

        Total: ${student.total}<br>
        Average: ${student.average.toFixed(2)}<br>
        Position: ${student.position}<br>
        <span class="grade">Grade: ${student.grade}</span><br><br>

        <button onclick="printResult('${student.name}')">🖨️ Print Report Card</button>
        `;
    } else {
        resultDiv.innerHTML = "Student not found!";
    }
}

function displayStudents() {

    rankStudents();

    let html = `<table>
    <tr>
        <th>Pos</th>
        <th>Name</th>
        <th>Class</th>
        <th>Total</th>
        <th>Avg</th>
        <th>Grade</th>
    </tr>`;

    students.forEach(s => {
        html += `
        <tr>
            <td>${s.position}</td>
            <td>${s.name}</td>
            <td>${s.class}</td>
            <td>${s.total}</td>
            <td>${s.average.toFixed(2)}</td>
            <td>${s.grade}</td>
        </tr>`;
    });

    html += "</table>";

    document.getElementById("tableContainer").innerHTML = html;
}

// 🖨️ PROFESSIONAL REPORT CARD
function printResult(name) {

    let s = students.find(st => st.name === name);

    let win = window.open("", "", "width=800,height=900");

    win.document.write(`
    <html>
    <head>
    <title>Report Card</title>

    <style>
        body { font-family: Arial; padding: 20px; }

        .header { text-align: center; }

        .header img { width: 80px; }

        .school-name { font-size: 22px; font-weight: bold; }

        .report-title { font-size: 18px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }

        table, th, td { border: 1px solid black; }

        th, td { padding: 8px; text-align: center; }

        .footer {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
        }

        .signature {
            border-top: 1px solid black;
            width: 150px;
            text-align: center;
            margin-top: 40px;
        }
    </style>

    </head>

    <body>

    <div class="header">
        <img src="logo.png"><br>
        <div class="school-name">SKYLIMIT ACADEMY</div>
        <div>Bawjiase - Central Region</div>
        <div class="report-title">Student Report Card</div>
    </div>

    <p><strong>Name:</strong> ${s.name}</p>
    <p><strong>Class:</strong> ${s.class}</p>

    <table>
        <tr><th>Subject</th><th>Score</th></tr>
        <tr><td>Mathematics</td><td>${s.math}</td></tr>
        <tr><td>English</td><td>$${s.english}</td></tr>
        <tr><td>Science</td><td>${s.science}</td></tr>
        <tr><td>ICT</td><td>${s.ICT}</td></tr>
        <tr><td>RME</td><td>${s.RME}</td></tr>
        <tr><td>Creative Arts</td><td>${s.Creative Arts}</td></tr>
        <tr><td>History</td><td>${s.history}</td></tr>
        <tr><td>Fante</td><td>${s.fante}</td></tr>
    </table>

    <p><strong>Total:</strong> ${s.total}</p>
    <p><strong>Average:</strong> ${s.average.toFixed(2)}</p>
    <p><strong>Position:</strong> ${s.position}</p>
    <p><strong>Grade:</strong> ${s.grade}</p>

    <div class="footer">
        <div class="signature">Class Teacher</div>
        <div class="signature">Headmaster</div>
    </div>

    </body>
    </html>
    `);

    win.document.close();
    win.print();
}
window.onload = async () => {

    if (localStorage.getItem("loggedIn") === "true") {

        document.getElementById("loginBox").style.display = "none";
        document.getElementById("mainSystem").style.display = "block";

        await loadStudents();
    }
};

async function rankStudents() {

    students.sort((a,b)=>b.total - a.total);

    for (let i = 0; i < students.length; i++) {

        students[i].position = i + 1;

        await supabase
            .from("students")
            .update({ position: i + 1 })
            .eq("id", students[i].id);
    }
}
</script>

</body>
</html>
