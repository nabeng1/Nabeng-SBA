<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Supabase Student Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#eef2f7;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2,h3{
    margin-bottom:15px;
}

input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    background:#007bff;
    color:#fff;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.card{
    background:#f8f9fa;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
}

img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
    margin-top:10px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.actions button{
    flex:1;
}

.loading{
    margin-top:10px;
    color:#007bff;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

    <h2>Student Portal (Supabase)</h2>

    <h3>Add / Update Student</h3>

    <input type="hidden" id="studentId">

    <input type="text" id="studentName" placeholder="Student Name">

    <input type="text" id="studentClass" placeholder="Class">

    <input type="number" id="math" placeholder="Math Score">

    <input type="number" id="english" placeholder="English Score">

    <input type="number" id="science" placeholder="Science Score">

    <input type="file" id="photo">

    <button onclick="saveStudent()">
        Save Student
    </button>

    <div class="loading" id="loading"></div>

    <hr style="margin:25px 0;">

    <h3>Search Student</h3>

    <input type="text" id="searchName" placeholder="Enter Student Name">

    <button onclick="searchStudent()">
        Search Student
    </button>

    <div id="result"></div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ======================================
// SUPABASE CONFIG
// ======================================

const supabaseUrl =
"https://ftslcifbzohhgljqcgus.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0c2xjaWZiem9oaGdsanFjZ3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTQ5NjUsImV4cCI6MjA5NTAzMDk2NX0.O6bGKNOdRDH1u2t-MiK8y0ppO-q-P4gggSeDEGsoUrQ";

const supabase =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

// ======================================
// HELPERS
// ======================================

function showLoading(text){
    document.getElementById("loading").innerText = text;
}

function clearLoading(){
    document.getElementById("loading").innerText = "";
}

function calculateTotal(student){

    return (
        Number(student.math) +
        Number(student.english) +
        Number(student.science)
    );
}

function calculateGrade(total){

    if(total >= 240) return "A";
    if(total >= 180) return "B";
    if(total >= 120) return "C";

    return "D";
}

function clearForm(){

    document.getElementById("studentId").value = "";
    document.getElementById("studentName").value = "";
    document.getElementById("studentClass").value = "";
    document.getElementById("math").value = "";
    document.getElementById("english").value = "";
    document.getElementById("science").value = "";
    document.getElementById("photo").value = "";
}

// ======================================
// UPLOAD PHOTO
// ======================================

async function uploadPhoto(file){

    if(!file) return "";

    const fileName =
    Date.now() + "-" + file.name;

    const { error } = await supabase
    .storage
    .from("student-photos")
    .upload(fileName, file);

    if(error){

        alert(error.message);

        return "";
    }

    const { data } = supabase
    .storage
    .from("student-photos")
    .getPublicUrl(fileName);

    return data.publicUrl;
}

// ======================================
// SAVE STUDENT
// ======================================

async function saveStudent(){

    try{

        showLoading("Saving student...");

        const id =
        document.getElementById("studentId").value;

        const photoFile =
        document.getElementById("photo").files[0];

        let photoUrl = "";

        if(photoFile){

            photoUrl =
            await uploadPhoto(photoFile);
        }

        const studentData = {

            name:
            document.getElementById("studentName").value,

            class:
            document.getElementById("studentClass").value,

            math:
            Number(document.getElementById("math").value),

            english:
            Number(document.getElementById("english").value),

            science:
            Number(document.getElementById("science").value)
        };

        if(photoUrl){

            studentData.photo = photoUrl;
        }

        let response;

        // UPDATE
        if(id){

            response = await supabase
            .from("students")
            .update(studentData)
            .eq("id", id);

        }else{

            // INSERT
            response = await supabase
            .from("students")
            .insert([studentData]);
        }

        if(response.error){

            alert(response.error.message);

            clearLoading();

            return;
        }

        alert(
            id
            ? "Student Updated Successfully"
            : "Student Saved Successfully"
        );

        clearForm();

        clearLoading();

    }catch(error){

        alert(error.message);

        clearLoading();
    }
}

// ======================================
// SEARCH STUDENT
// ======================================

async function searchStudent(){

    try{

        showLoading("Searching...");

        const searchName =
        document.getElementById("searchName")
        .value
        .trim()
        .toLowerCase();

        const result =
        document.getElementById("result");

        const { data, error } =
        await supabase
        .from("students")
        .select("*");

        if(error){

            result.innerHTML = error.message;

            clearLoading();

            return;
        }

        const student = data.find(s =>

            s.name &&
            s.name.toLowerCase() === searchName
        );

        if(!student){

            result.innerHTML =
            "<p>Student not found</p>";

            clearLoading();

            return;
        }

        const total =
        calculateTotal(student);

        const grade =
        calculateGrade(total);

        result.innerHTML = `

        <div class="card">

            <h3>${student.name}</h3>

            <p><b>Class:</b> ${student.class}</p>

            <p><b>Math:</b> ${student.math}</p>

            <p><b>English:</b> ${student.english}</p>

            <p><b>Science:</b> ${student.science}</p>

            <p><b>Total:</b> ${total}</p>

            <p><b>Grade:</b> ${grade}</p>

            ${
                student.photo
                ?
                `<img src="${student.photo}">`
                :
                ""
            }

            <div class="actions">

                <button onclick="editStudent('${student.id}')">
                    Edit
                </button>

                <button onclick="deleteStudent('${student.id}')">
                    Delete
                </button>

                <button onclick="printReport('${student.id}')">
                    Print
                </button>

            </div>

        </div>
        `;

        clearLoading();

    }catch(error){

        alert(error.message);

        clearLoading();
    }
}

// ======================================
// EDIT STUDENT
// ======================================

async function editStudent(id){

    const { data, error } =
    await supabase
    .from("students")
    .select("*")
    .eq("id", id)
    .single();

    if(error){

        alert(error.message);

        return;
    }

    document.getElementById("studentId").value =
    data.id;

    document.getElementById("studentName").value =
    data.name;

    document.getElementById("studentClass").value =
    data.class;

    document.getElementById("math").value =
    data.math;

    document.getElementById("english").value =
    data.english;

    document.getElementById("science").value =
    data.science;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

// ======================================
// DELETE STUDENT
// ======================================

async function deleteStudent(id){

    if(!confirm("Delete this student?"))
    return;

    const { error } =
    await supabase
    .from("students")
    .delete()
    .eq("id", id);

    if(error){

        alert(error.message);

        return;
    }

    alert("Student Deleted");

    document.getElementById("result").innerHTML = "";
}

// ======================================
// PRINT REPORT
// ======================================

async function printReport(id){

    const { data, error } =
    await supabase
    .from("students")
    .select("*")
    .eq("id", id)
    .single();

    if(error){

        alert(error.message);

        return;
    }

    const total =
    calculateTotal(data);

    const grade =
    calculateGrade(total);

    const printWindow =
    window.open("", "", "width=700,height=700");

    printWindow.document.write(`

        <h2>Student Report</h2>

        <p><b>Name:</b> ${data.name}</p>

        <p><b>Class:</b> ${data.class}</p>

        <p><b>Math:</b> ${data.math}</p>

        <p><b>English:</b> ${data.english}</p>

        <p><b>Science:</b> ${data.science}</p>

        <p><b>Total:</b> ${total}</p>

        <p><b>Grade:</b> ${grade}</p>

        ${
            data.photo
            ?
            `<img src="${data.photo}" width="120">`
            :
            ""
        }

    `);

    printWindow.print();
}

</script>

</body>
</html>
